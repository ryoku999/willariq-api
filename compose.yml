services:
  app-server:
    build:
      context: .
      target: production
      dockerfile: ./Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 8000
      TZ: America/Lima

    expose:
      - "8000"

    security_opt:
      - no-new-privileges:true

    networks:
      dokploy-network:
        aliases:
          - willariq-api

networks:
  dokploy-network:
    external: true